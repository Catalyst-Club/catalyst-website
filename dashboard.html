<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Catalyst Club — Dashboard</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
  /* ---------- Simple glassmorphic styling (kept compact) ---------- */
  :root{
    --muted:#9aa4b2;
    --glass-border: rgba(255,255,255,0.08);
  }
  html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;background:linear-gradient(135deg,#071026,#0f1e3a);color:#e6eef8;-webkit-font-smoothing:antialiased}
  .wrap{display:grid;grid-template-columns:260px 1fr;gap:24px;padding:24px;height:100vh;box-sizing:border-box}
  .sidebar{border-radius:14px;padding:18px;background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015));backdrop-filter:blur(8px);border:1px solid var(--glass-border);display:flex;flex-direction:column}
  .brand{display:flex;gap:10px;align-items:center}
  .brand .logo{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#7c3aed,#06b6d4);display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:white;font-size:18px}
  .nav-link{display:block;padding:10px;border-radius:10px;color:var(--muted);text-decoration:none;margin-top:8px;font-weight:600}
  .nav-link.active{background:linear-gradient(90deg,#5b21b6,#0891b2);color:#fff}
  .user-card{margin-top:auto;padding:12px;border-radius:12px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border:1px solid var(--glass-border);display:flex;gap:12px;align-items:center}
  .avatar{width:48px;height:48px;border-radius:10px;background:#0ea5a4;display:flex;align-items:center;justify-content:center;font-weight:700;color:#021}
  .main{overflow:auto}
  .grid{display:grid;grid-template-columns:1fr 380px;gap:20px;margin-bottom:20px}
  .card{border-radius:12px;padding:16px;background:linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.01));border:1px solid var(--glass-border);box-shadow:0 8px 30px rgba(2,6,23,0.5);backdrop-filter:blur(8px)}
  .message-area textarea{width:100%;min-height:110px;border-radius:10px;padding:12px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit;resize:vertical}
  .file-row{display:flex;align-items:center;gap:10px;margin-top:10px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:none;background:linear-gradient(90deg,#7c3aed,#06b6d4);color:#fff;font-weight:700;cursor:pointer}
  .status{margin-top:10px;color:var(--muted);font-size:13px}
  .feed{margin-top:12px;display:flex;flex-direction:column;gap:12px;max-height:480px;overflow:auto;padding-right:6px}
  .post{padding:12px;border-radius:10px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.03)}
  .post .meta{font-size:12px;color:var(--muted);margin-bottom:6px}
  .profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .profile-item{background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.03);font-size:14px}
  .alumni-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  @media (max-width:980px){.wrap{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.user-card{display:none}}
  a.file-link{color:#c7d2fe;text-decoration:none}
  </style>
</head>
<body>

<div class="wrap">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">CC</div>
      <div>
        <h1 style="font-size:16px;margin:0">Catalyst Club</h1>
        <div style="font-size:12px;color:var(--muted)">Member Dashboard</div>
      </div>
    </div>

    <nav style="margin-top:16px">
      <a class="nav-link" href="index.html"> Home</a>
      <a class="nav-link active" href="#messages" onclick="scrollToSection('#messages')"> Messages</a>
      <a class="nav-link" href="alumni.html"> Resources</a>
      <a class="nav-link" href="contact.html"> Report!</a>
      <a class="nav-link" href="https://hiphaldia.org/"> College Web</a>
      <a class="nav-link" href="https://digipharmed.pci.gov.in/#/digipharmed"> PCI(DigiPharmed)</a>
      <a class="nav-link" href="alumni.html"> Alumni</a>

    </nav>

    <div class="user-card" id="sidebarUserCard">
      <div class="avatar" id="avatarInitial">J</div>
      <div>
        <div style="font-weight:700" id="sidebarName">John Doe</div>
        <div style="font-size:13px;color:var(--muted)"><b id="sidebarId">CLB000</b></div>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="grid">
      <div>
        <!-- MESSAGES -->
        <section id="messages" class="card message-area">
          <h3 style="margin:0 0 10px 0">Community Messages</h3>

          <form id="messageForm">
            <textarea id="messageText" placeholder="Share an announcement, question or file with the club..."></textarea>

            <div class="file-row">
              <label class="btn" for="fileInput">Attach file</label>
              <input id="fileInput" type="file" accept=".png,.jpg,.jpeg,.pdf,.doc,.docx" style="display:none">
              <div style="flex:1;color:var(--muted)" id="fileNamePreview">No file selected</div>
              <div style="display:flex;gap:8px">
                <button class="btn" id="postBtn" type="submit">Post</button>
              </div>
            </div>

            <div class="status" id="postStatus"></div>
          </form>

          <h4 style="margin-top:18px">Recent Posts</h4>
          <div class="feed" id="messageFeed" aria-live="polite"></div>
        </section>

        <!-- ALUMNI (mobile) -->
        <section id="alumni" class="card" style="margin-top:18px; display:none">
          <h3>Alumni Directory</h3>
          <div class="alumni-grid" id="alumniList"></div>
        </section>
      </div>

      <aside>
        <!-- PROFILE -->
        <section id="profile" class="card">
          <h3>My Details</h3>
          <div style="margin-top:10px" class="profile-grid">
            <div class="profile-item">
              <div style="font-size:12px;color:var(--muted);margin-bottom:6px">Full name</div>
              <div id="userName">—</div>
            </div>
            <div class="profile-item">
              <div style="font-size:12px;color:var(--muted);margin-bottom:6px">Membership ID</div>
              <div id="userMembership">—</div>
            </div>

            <div class="profile-item">
              <div style="font-size:12px;color:var(--muted);margin-bottom:6px">Joined</div>
              <div id="userJoinDate">—</div>
            </div>
            <div class="profile-item">
              <div style="font-size:12px;color:var(--muted);margin-bottom:6px">Email</div>
              <div id="userEmail">—</div>
            </div>

            <div class="profile-item">
              <div style="font-size:12px;color:var(--muted);margin-bottom:6px">Phone</div>
              <div id="userPhone">—</div>
            </div>
            <div class="profile-item">
              <div style="font-size:12px;color:var(--muted);margin-bottom:6px">Other</div>
              <div id="userOther">—</div>
            </div>
          </div>

          <div style="margin-top:14px;display:flex;gap:10px;">
            <button class="btn" id="signOutBtn">Sign out</button>
            <button class="btn" id="refreshBtn" style="background:#374151">Refresh</button>
          </div>
        </section>

        <!-- ALUMNI (desktop) -->
        <section class="card" style="margin-top:18px">
          <h3 style="margin-top:0">Alumni Directory</h3>
          <div class="alumni-grid" id="alumniListSide"></div>
        </section>
      </aside>
    </div>
  </main>
</div>

<!-- ================= Firebase (module) =================
     - Uses your Firebase config below
     - Requires HTTPS origin or local server
     - Remove analytics to avoid extra failures
====================================================== -->
<script type="module">
/* ------------- imports ------------- */
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {
  getFirestore, collection, addDoc, serverTimestamp,
  query, orderBy, limit, onSnapshot, getDocs, doc, getDoc, where
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
import { getStorage, ref as storageRef, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-storage.js";

/* ------------- your firebase config ------------- 
   (you already provided this; keep it or replace if needed)
*/
const firebaseConfig = {
  apiKey: "AIzaSyDJeFMQeayKhTERBFMgGbx3Tq_v2cvY3OQ",
  authDomain: "catalyst-login1.firebaseapp.com",
  projectId: "catalyst-login1",
  storageBucket: "catalyst-login1.appspot.com",
  messagingSenderId: "966641571185",
  appId: "1:966641571185:web:af4144c369f85e3a5392d0",
  measurementId: "G-XRCWBMQF30"
};

/* ------------- initialize ------------- */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

/* ------------- UI refs ------------- */
const messageForm = document.getElementById('messageForm');
const messageText = document.getElementById('messageText');
const fileInput = document.getElementById('fileInput');
const fileNamePreview = document.getElementById('fileNamePreview');
const postStatus = document.getElementById('postStatus');
const postBtn = document.getElementById('postBtn');
const messageFeed = document.getElementById('messageFeed');

const userNameEl = document.getElementById('userName');
const userMembershipEl = document.getElementById('userMembership');
const userJoinDateEl = document.getElementById('userJoinDate');
const userEmailEl = document.getElementById('userEmail');
const userPhoneEl = document.getElementById('userPhone');
const userOtherEl = document.getElementById('userOther');
const sidebarName = document.getElementById('sidebarName');
const sidebarId = document.getElementById('sidebarId');
const avatarInitial = document.getElementById('avatarInitial');

const alumniListSide = document.getElementById('alumniListSide');
const alumniList = document.getElementById('alumniList');
const signOutBtn = document.getElementById('signOutBtn');
const refreshBtn = document.getElementById('refreshBtn');

let currentUser = null;

/* ------------- helpers ------------- */
function scrollToSection(sel){
  const el = document.querySelector(sel);
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}
function escapeHtml(s){
  if(!s && s!=='') return '';
  return String(s).replace(/[&<>"'`]/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[m]));
}

/* ------------- small UI wiring ------------- */
fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  fileNamePreview.textContent = f ? `${f.name} (${Math.round(f.size/1024)} KB)` : 'No file selected';
});

/* sign out button - works for both sessionStorage-based login and Firebase auth */
signOutBtn.addEventListener('click', async () => {
  // clear sessionStorage if used
  try { sessionStorage.removeItem('currentUser'); } catch(e){/*ignore*/}
  // try Firebase sign out if used
  try { await signOut(auth); } catch(e){/*ignore*/}
  window.location.href = "login.html";
});

refreshBtn.addEventListener('click', () => { loadAlumni(); });

/* ------------- Authentication logic -------------
   - If sessionStorage.currentUser exists (your existing login flow), use it.
   - Otherwise wait for Firebase onAuthStateChanged and use that user.
   - If neither exists, redirect to login.html
*/
async function startApp(){
  // 1) sessionStorage-based login (your old login page writes currentUser)
  try {
    const raw = sessionStorage.getItem('currentUser');
    if (raw) {
      const u = JSON.parse(raw);
      // expected shape: { name: "...", id: "..." } (your login page uses that)
      await populateProfileFromSession(u);
      startMessagesListener(); loadAlumni();
      return;
    }
  } catch(e){
    console.warn("session parse error", e);
  }

  // 2) Otherwise use Firebase auth
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      // Not signed in -> redirect to login (your existing login page)
      window.location.href = "login.html";
      return;
    }
    currentUser = user;
    await populateProfileFromAuth(user);
    startMessagesListener(); loadAlumni();
  });
}

/* ------------- populate profile (sessionStorage path) ------------- */
async function populateProfileFromSession(u){
  // u may have name and id
  const displayName = u.name || "Member";
  const membershipId = u.id || (u.uid ? u.uid.slice(0,8) : '—');

  userNameEl.textContent = displayName;
  userEmailEl.textContent = u.email || '—';
  userMembershipEl.textContent = membershipId;
  sidebarName.textContent = displayName;
  sidebarId.textContent = membershipId;
  avatarInitial.textContent = (displayName[0] || 'U').toUpperCase();

  // try fetch detailed record from users collection by id (membershipId) or name
  try {
    if (u.id) {
      // search where id == membership id
      const q = query(collection(db, 'users'), where('id','==', u.id));
      const snap = await getDocs(q);
      if (!snap.empty) {
        const docSnap = snap.docs[0];
        const data = docSnap.data();
        fillProfileFields(data);
        return;
      }
    }
    // fallback: try by name
    if (u.name) {
      const q2 = query(collection(db, 'users'), where('name','==', u.name));
      const snap2 = await getDocs(q2);
      if (!snap2.empty) {
        fillProfileFields(snap2.docs[0].data());
      }
    }
  } catch(err){
    console.error('Error loading profile from session:', err);
  }
}

/* ------------- populate profile (firebase auth path) ------------- */
async function populateProfileFromAuth(user){
  currentUser = user;
  const displayName = user.displayName || "Member";
  userNameEl.textContent = displayName;
  userEmailEl.textContent = user.email || '—';
  userMembershipEl.textContent = user.uid.slice(0,8);
  sidebarName.textContent = displayName;
  sidebarId.textContent = user.uid.slice(0,8);
  avatarInitial.textContent = (displayName[0] || 'U').toUpperCase();

  // try to fetch users/{uid}
  try {
    const userDocRef = doc(db, 'users', user.uid);
    const snap = await getDoc(userDocRef);
    if (snap.exists()) {
      fillProfileFields(snap.data());
      return;
    }
    // fallback: search by email
    if (user.email) {
      const q = query(collection(db,'users'), where('email','==', user.email));
      const snap2 = await getDocs(q);
      if (!snap2.empty) fillProfileFields(snap2.docs[0].data());
    }
  } catch(err){
    console.error('Error loading profile from auth user:', err);
  }
}

function fillProfileFields(data){
  userNameEl.textContent = data.name || userNameEl.textContent;
  userMembershipEl.textContent = data.membershipId || userMembershipEl.textContent;
  userJoinDateEl.textContent = data.joinDate || data.joinedOn || '—';
  userPhoneEl.textContent = data.phone || '—';
  userOtherEl.textContent = data.other || '—';
  sidebarName.textContent = data.name || sidebarName.textContent;
}

/* ------------- file upload helper ------------- */
async function uploadFile(file){
  if(!file) return null;
  // create storage ref
  const uidPart = (currentUser && currentUser.uid) ? currentUser.uid.slice(0,8) : 'anon';
  const key = `${Date.now()}_${uidPart}_${file.name.replace(/\s+/g,'_')}`;
  const r = storageRef(storage, `message_files/${key}`);

  return new Promise((resolve, reject) => {
    const task = uploadBytesResumable(r, file);
    task.on('state_changed',
      (snapshot) => {
        const pct = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
        postStatus.textContent = `Uploading file: ${pct}%`;
      },
      (err) => reject(err),
      async () => {
        const url = await getDownloadURL(task.snapshot.ref);
        resolve({ url, name: file.name });
      }
    );
  });
}

/* ------------- posting messages ------------- */
messageForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  // ensure either session login or firebase auth exists
  try {
    // get possible currentUser if not set (session path)
    if (!currentUser) {
      const raw = sessionStorage.getItem('currentUser');
      if (raw) { /* keep using session flow */ }
      else { postStatus.textContent = "Not authenticated."; return; }
    }
  } catch(e){ /* no session */ }

  const text = messageText.value.trim();
  const file = fileInput.files[0] || null;
  if (!text && !file) { postStatus.textContent = "Please enter a message or attach a file."; return; }

  postBtn.disabled = true;
  postStatus.textContent = "Preparing...";

  try {
    let fileMeta = null;
    if (file) fileMeta = await uploadFile(file);

    // author info
    let authorName = (currentUser && currentUser.displayName) ? currentUser.displayName : null;
    let uid = (currentUser && currentUser.uid) ? currentUser.uid : null;
    // fallback to sessionStorage info if exist
    try {
      const raw = sessionStorage.getItem('currentUser');
      if (raw) {
        const u = JSON.parse(raw);
        authorName = authorName || u.name || authorName || "Member";
        uid = uid || u.id || uid;
      }
    } catch(e){}

    const payload = {
      uid: uid || null,
      authorName: authorName || (authorName === null ? 'Member' : authorName),
      text: text || null,
      fileUrl: fileMeta ? fileMeta.url : null,
      fileName: fileMeta ? fileMeta.name : null,
      createdAt: serverTimestamp()
    };

    await addDoc(collection(db, 'messages'), payload);

    postStatus.textContent = "Posted successfully.";
    messageForm.reset();
    fileNamePreview.textContent = "No file selected";
    postBtn.disabled = false;
  } catch(err){
    console.error("Post error:", err);
    postStatus.textContent = "Failed to send message. Try again.";
    postBtn.disabled = false;
  }
});

/* ------------- live feed (messages) ------------- */
let unsubscribeMessages = null;
function startMessagesListener(){
  if(unsubscribeMessages) unsubscribeMessages();
  const q = query(collection(db, 'messages'), orderBy('createdAt','desc'), limit(100));
  unsubscribeMessages = onSnapshot(q, (snap) => {
    const arr = [];
    snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
    renderMessages(arr);
  }, (err) => {
    console.error('messages onSnapshot error:', err);
    messageFeed.innerHTML = '<div style="color:var(--muted)">Could not load live feed.</div>';
  });
}

function renderMessages(arr){
  messageFeed.innerHTML = '';
  if(!arr.length){ messageFeed.innerHTML = '<div style="color:var(--muted)">No posts yet.</div>'; return; }
  arr.forEach(item => {
    const el = document.createElement('div');
    el.className = 'post';
    const timeStr = item.createdAt && item.createdAt.toDate ? item.createdAt.toDate().toLocaleString() : '';
    el.innerHTML = `
      <div class="meta"><strong>${escapeHtml(item.authorName||'Member')}</strong> • <span>${timeStr}</span></div>
      <div class="text">${item.text ? escapeHtml(item.text) : ''}</div>
      ${item.fileUrl ? `<div style="margin-top:10px"><a class="file-link" href="${item.fileUrl}" target="_blank" rel="noopener noreferrer">📎 ${escapeHtml(item.fileName||'attachment')}</a></div>` : ''}
    `;
    messageFeed.appendChild(el);
  });
}

/* ------------- alumni listing ------------- */
async function loadAlumni(){
  alumniListSide.innerHTML = ''; alumniList.innerHTML = '';
  try {
    const snap = await getDocs(collection(db, 'alumni'));
    const items = []; snap.forEach(d => items.push({ id: d.id, ...d.data() }));
    if(!items.length){
      alumniListSide.innerHTML = '<div style="color:var(--muted)">No alumni found.</div>';
      alumniList.innerHTML = '<div style="color:var(--muted)">No alumni found.</div>';
      return;
    }
    items.forEach(a => {
      const card = createAlumniCard(a);
      alumniListSide.appendChild(card.cloneNode(true));
      alumniList.appendChild(card);
    });
  } catch(err){
    console.error('Error loading alumni:', err);
    alumniListSide.innerHTML = '<div style="color:var(--muted)">Error loading alumni.</div>';
    alumniList.innerHTML = '<div style="color:var(--muted)">Error loading alumni.</div>';
  }
}
function createAlumniCard(a){
  const card = document.createElement('div'); card.className = 'alumni-card';
  card.style.padding = '12px'; card.style.borderRadius = '10px'; card.style.background = 'linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01))'; card.style.border = '1px solid rgba(255,255,255,0.03)';
  card.innerHTML = `
    <h4 style="margin:0 0 6px 0;font-size:15px">${escapeHtml(a.name||'—')}</h4>
    <div style="font-size:13px;color:var(--muted)">
      <div>Batch: ${escapeHtml(a.batch||'—')}</div>
      <div>Past Role: ${escapeHtml(a.pastRole||'—')}</div>
      <div>Current: ${escapeHtml(a.currentPosition||'—')}</div>
      <div>Phone: ${escapeHtml(a.phone||'—')}</div>
      <div>Email: <a style="color:#c7d2fe" href="mailto:${encodeURI(a.email||'')}">${escapeHtml(a.email||'—')}</a></div>
    </div>
  `;
  return card;
}

/* ------------- start the app ------------- */
startApp();

/* --------- Utility for older browsers that might not support optional chaining (defensive) --------- */
</script>

</body>
</html>
