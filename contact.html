<!-- Contact Us Section -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalyst Club - Ignite Ideas. Inspire Change.</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    

</head>

<body>
    <section id="contact" class="contact-section">
    <div class="container">
        <h2 class="section-title">Contact Us</h2>
        <div class="contact-content">
            <div class="contact-info">
                <h3>Get in Touch</h3>
                <div class="info-details">
                    <div class="info-item">
                        <i class="fas fa-envelope"></i>
                        <p>hello@catalstclub.in</p>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-map-marker-alt"></i>
                        <p>The Catalyst Club<br>Haldia Institute of Pharmacy<br>ICARE Complex, HIT Campus,<br>721657
                            Haldia, West Bengal</p>
                    </div>
                </div>
                <div class="map-container">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3695.7221421295363!2d88.0681663!3d22.0506083!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a02f0c0af956751%3A0x6d4186f2554dc5c!2sHaldia%20Institute%20of%20Pharmacy!5e0!3m2!1sen!2sin!4v1628805721234!5m2!1sen!2sin"
                        width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy">
                    </iframe>
                </div>
            </div>

            <div class="contact-form-container">
                <h3>Leave Us Your Thoughts</h3>
                <form action="#" class="contact-form" id="contactForm">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                        <span class="error-message" id="nameError"></span>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                        <span class="error-message" id="emailError"></span>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                        <span class="error-message" id="messageError"></span>
                    </div>
                    <button type="submit" class="submit-button">Send Message</button>
                </form>
            </div>
        </div>
    </div>
</section>

<script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  
    const firebaseConfig = {
      apiKey: "AIzaSyDJeFMQeayKhTERBFMgGbx3Tq_v2cvY3OQ",
      authDomain: "catalyst-login1.firebaseapp.com",
      projectId: "catalyst-login1",
      storageBucket: "catalyst-login1.firebasestorage.app",
      messagingSenderId: "966641571185",
      appId: "1:966641571185:web:af4144c369f85e3a5392d0",
      measurementId: "G-XRCWBMQF30"
    };
  
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
  
    const form = document.getElementById("contactForm");
  
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
  
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const message = document.getElementById("message").value.trim();
  
      if (!name || !email || !message) {
        alert("Fill everything properly.");
        return;
      }
  
      try {
        await addDoc(collection(db, "contact_us"), {
          name,
          email,
          message,
          timestamp: new Date()
        });
  
        alert("Message sent!");
        form.reset();
  
      } catch (error) {
        console.error(error);
        alert("Error sending message.");
      }
    });
  
  </script>
  
</body>
