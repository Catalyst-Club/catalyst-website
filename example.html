<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Catalyst Club — Home</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#f5f9fb;
    --bg2:#eaf6f7;
    --glass-bg: rgba(255,255,255,0.7);
    --glass-border: rgba(255,255,255,0.6);
    --accent:#08b6b0;
    --accent2:#6a4ce5;
    --muted:#6b7a80;
    --text:#06222b;
    --card-shadow: 0 10px 30px rgba(6,18,22,0.06);
  }

  /* reset */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--text);-webkit-font-smoothing:antialiased}
  a{color:inherit}

  /* layout */
  .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
  .shell{width:100%;max-width:980px;display:grid;grid-template-columns:1fr 420px;gap:28px;align-items:center}
  @media(max-width:860px){.shell{grid-template-columns:1fr;gap:18px;padding:12px}}

  /* header small */
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .brand{display:flex;gap:12px;align-items:center}
  .logo{width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;font-weight:700;box-shadow:0 6px 20px rgba(9,14,20,0.06)}
  .nav{display:flex;gap:10px}
  .nav a{padding:8px 12px;border-radius:10px;background:rgba(255,255,255,0.7);backdrop-filter:blur(6px);font-weight:600;color:var(--muted);text-decoration:none}

  /* left content */
  .hero-left{padding:6px}
  .eyebrow{font-size:13px;color:var(--muted);font-weight:700}
  h1{font-size:36px;line-height:1.03;margin:10px 0;font-weight:800;letter-spacing:-0.5px}
  .accent-word{color:var(--accent)}
  .lead{color:var(--muted);font-weight:600;margin-top:8px}
  .cta{display:inline-flex;gap:10px;align-items:center;padding:12px 16px;border-radius:12px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;font-weight:700;margin-top:18px;box-shadow:0 12px 36px rgba(10,20,30,0.08)}
  .muted{color:var(--muted)}

  /* right card (glass) */
  .glass{border-radius:16px;padding:18px;background:var(--glass-bg);border:1px solid var(--glass-border);box-shadow:var(--card-shadow);backdrop-filter: blur(8px);display:flex;align-items:center;justify-content:center;flex-direction:column;min-height:320px}
  .orb{width:78%;aspect-ratio:1/1;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(255,255,255,0.95),rgba(255,255,255,0.9));box-shadow:inset 0 6px 18px rgba(0,0,0,0.03)}
  .orb svg{width:55%;height:auto;opacity:0.98}

  /* very small floating dot (decoration) */
  .dot{
    position:absolute;right:22px;top:22px;width:12px;height:12px;border-radius:50%;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 6px 22px rgba(10,20,30,0.08);
    animation:float 4s ease-in-out infinite;
    transform-origin:center;
  }

  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

  /* word bump subtle */
  .headline-words{display:inline-flex;gap:10px;align-items:center}
  .headline-words span{display:inline-block;animation:word-bump 3s ease-in-out infinite}
  .headline-words span:nth-child(2){animation-delay:.28s}
  @keyframes word-bump{0%,100%{transform:translateY(0)}10%{transform:translateY(-6px)}22%{transform:translateY(0)}}

  /* utilities */
  .center{text-align:center}
  small{display:block;margin-top:12px;color:var(--muted)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="shell" role="main">
      <!-- left -->
      <div>
        <header aria-label="site header">
          <div class="brand" aria-hidden="true">
            <div class="logo">CC</div>
            <div style="line-height:1">
              <div style="font-weight:800">CATALYST <span style="color:var(--accent)">CLUB</span></div>
              <div style="font-size:12px;color:var(--muted)">Haldia Institute of Pharmacy</div>
            </div>
          </div>

          <nav class="nav" aria-label="primary">
            <a href="#about">About</a>
            <a href="#events">Events</a>
            <a href="#contact">Contact</a>
          </nav>
        </header>

        <section class="hero-left" aria-labelledby="hero-heading">
          <div class="eyebrow">Welcome to</div>
          <h1 id="hero-heading">
            <span class="headline-words">
              <span>CATALYST</span>
              <span class="accent-word">CLUB</span>
            </span>
          </h1>
          <div class="lead">Bringing tech close to you — workshops, projects, and friendly meets.</div>
          <a class="cta" href="#contact" role="button">Collaborate with us →</a>
          <small class="muted">Join us — we started in 2025</small>
        </section>
      </div>

      <!-- right glass card -->
      <aside class="glass" aria-label="visual">
        <div class="dot" aria-hidden="true"></div>

        <div class="orb" role="img" aria-label="Catalyst Club logo">
          <!-- minimal, crisp inline SVG logo (replace if you have a better one) -->
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
            <defs>
              <linearGradient id="g1" x1="0" x2="1">
                <stop offset="0" stop-color="#6a4ce5"/>
                <stop offset="1" stop-color="#08b6b0"/>
              </linearGradient>
            </defs>
            <rect width="200" height="200" rx="30" fill="transparent"/>
            <g transform="translate(20,30)">
              <text x="0" y="110" font-family="Inter, Poppins, Arial" font-weight="800" font-size="96" fill="url(#g1)">CC</text>
            </g>
          </svg>
        </div>

        <div style="margin-top:14px;font-weight:700">Catalyst Club</div>
        <div style="font-size:13px;color:var(--muted);margin-top:6px">Ideas • Learn • Build</div>
      </aside>
    </div>
  </div>

<script>
/*
 Ultra-minimal JS:
 - keeps animations tiny (CSS does the heavy lifting)
 - no external libs
 - accessible & tiny footprint
*/

// nothing to do — placeholder if you want to add small interactive bits later.
// Example: if you want the CTA to smooth scroll:
document.querySelectorAll('a[href^="#"]').forEach(a=>{
  a.addEventListener('click', (e)=>{
    const t = document.querySelector(a.getAttribute('href'));
    if(t){ e.preventDefault(); t.scrollIntoView({behavior:'smooth', block:'start'}); }
  });
});
</script>
<style>
    /* Container */
    #visitBox {
        position: relative;
        max-width: 240px;
        padding: 18px 24px;
        margin: 30px auto;
        border-radius: 20px;
        background: rgba(255,255,255,0.12);
        border: 1px solid rgba(255,255,255,0.28);
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        text-align: center;
        font-family: "Inter", sans-serif;
        color: #e6e6e6;
        overflow: hidden;
    }
    
    /* Bubbles */
    .bubble {
        position: absolute;
        width: 12px;
        height: 12px;
        background: rgba(255,255,255,0.25);
        border-radius: 50%;
        animation: rise 6s infinite ease-in;
        bottom: -20px;
    }
    
    @keyframes rise {
        0% { transform: translateY(0) scale(1); opacity: 0.3; }
        50% { opacity: 1; }
        100% { transform: translateY(-180px) scale(1.6); opacity: 0; }
    }
    
    /* Counter text */
    #visitCounter {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 1px;
    }
    
    #visitLabel {
        font-size: 14px;
        opacity: .8;
    }
    </style>
    
    <div id="visitBox">
        <div id="visitLabel">Visits</div>
        <div id="visitCounter">0</div>
    </div>
    
    <script>
    // Generate floating bubbles
    function spawnBubbles() {
        const box = document.getElementById("visitBox");
        for (let i = 0; i < 10; i++) {
            const b = document.createElement("div");
            b.classList.add("bubble");
            b.style.left = Math.random() * 100 + "%";
            b.style.animationDelay = (Math.random() * 5) + "s";
            b.style.opacity = Math.random() * 0.8 + 0.2;
            box.appendChild(b);
        }
    }
    spawnBubbles();
    
    // Fetch counter value
    fetch("https://pixelcounter.io/api/count?name=catalystclub")
        .then(r => r.json())
        .then(data => {
            animateValue("visitCounter", 1, data.count, 1200);
        })
        .catch(() => {
            document.getElementById("visitCounter").textContent = "ERR";
        });
    
    // Smooth animated counter-up
    function animateValue(id, start, end, duration) {
        const obj = document.getElementById(id);
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            obj.textContent = Math.floor(progress * (end - start) + start);
            if (progress < 1) window.requestAnimationFrame(step);
        };
        window.requestAnimationFrame(step);
    }
    </script>
    
  
</body>
</html>
